<!DOCTYPE html>
<html lang="hu">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Drift</title>
<link rel="preconnect" href="https://fonts.googleapis.com"><link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@500;800&family=Rajdhani:wght@500;700&display=swap" rel="stylesheet">
<style>
:root{--bg:#f4f1ea;--fg:#1c1c1e;--panel:rgba(255,255,255,.88);--ac:rgb(224,69,58);--acr:224,69,58;--tr:0;--hurt:0;--font:'Rajdhani','Segoe UI',system-ui,sans-serif;--head:'Orbitron','Rajdhani',system-ui,sans-serif;box-sizing:border-box}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#0d0f14;--fg:#e8e8ea;--panel:rgba(25,28,36,.88)}}
:root[data-theme="dark"]{--bg:#0d0f14;--fg:#e8e8ea;--panel:rgba(25,28,36,.88)}
html,body{height:100%;margin:0;overflow:hidden;background:var(--bg);color:var(--fg);font:500 16px var(--font);touch-action:none;user-select:none;-webkit-user-select:none}
canvas{position:fixed;inset:0;width:100%;height:100%;display:block}
body::after{content:"";position:fixed;inset:0;pointer-events:none;z-index:3;box-shadow:inset 0 0 120px rgba(224,69,58,calc(var(--hurt)*.55)),inset 0 0 220px rgba(var(--acr),calc(var(--tr)*.4))}
[data-skin=retro] body::before,body[data-skin=retro]::before{content:"";position:fixed;inset:0;pointer-events:none;z-index:3;background:repeating-linear-gradient(0deg,rgba(0,0,0,.18) 0 1px,transparent 1px 3px)}
body[data-skin=retro] *{font-family:'Courier New',monospace!important}
body[data-skin=retro] .card,body[data-skin=retro] button.b,body[data-skin=retro] #panel,body[data-skin=retro] #gear,body[data-skin=retro] #toast{border-radius:2px!important}
.hud{position:fixed;left:0;right:0;top:0;padding:calc(env(safe-area-inset-top,0px) + 14px) 18px 0;display:flex;justify-content:space-between;pointer-events:none;z-index:4}
#score{font:800 clamp(30px,6vw,46px)/1 var(--head);display:inline-block;text-shadow:0 0 calc(6px + var(--tr)*26px) var(--ac)}
#score.b{animation:bump .25s}
@keyframes bump{0%{transform:scale(1.4)}100%{transform:scale(1)}}
.s{opacity:.65;font-size:14px;min-height:18px;letter-spacing:1px;text-transform:uppercase}
#lives{color:var(--ac);opacity:1;font-size:20px;letter-spacing:4px}
#fx{margin-top:4px}
#fx span{display:inline-block;padding:2px 10px;border:1px solid currentColor;border-radius:99px;margin:3px 6px 0 0;font:700 11px var(--head);letter-spacing:1px;animation:pulse .8s infinite alternate}
@keyframes pulse{to{opacity:.55;transform:scale(.97)}}
#fps{opacity:.6;font:600 12px var(--head);text-align:right;font-variant-numeric:tabular-nums;padding-top:6px}
#gear,#pz{pointer-events:auto;cursor:pointer;width:38px;height:38px;margin-left:12px;font-size:19px;color:inherit;background:var(--panel);border:1px solid rgba(var(--acr),.4);border-radius:50%;backdrop-filter:blur(8px);transition:transform .3s}
#gear:hover{transform:rotate(60deg) scale(1.1)}
#panel{position:fixed;right:12px;top:calc(env(safe-area-inset-top,0px) + 60px);background:var(--panel);backdrop-filter:blur(14px);border:1px solid rgba(var(--acr),.35);border-radius:16px;padding:14px 18px;width:250px;box-shadow:0 14px 40px rgba(0,0,0,.35);z-index:9;opacity:0;visibility:hidden;transform:translateY(-10px);transition:.25s}
#panel.on{opacity:1;visibility:visible;transform:none}
#panel b{font:700 13px var(--head);letter-spacing:2px;text-transform:uppercase}
#panel label{display:flex;justify-content:space-between;align-items:center;margin:12px 0}
#panel select,#panel input[type=range]{width:120px}
#panel select{background:transparent;color:inherit;border:1px solid rgba(var(--acr),.5);border-radius:8px;padding:3px 6px;font:inherit}
#panel input{accent-color:var(--ac)}
.ov{position:fixed;inset:0;display:flex;align-items:center;justify-content:center;background:radial-gradient(circle at center,rgba(0,0,0,.35),rgba(0,0,0,.65));z-index:5;overflow:auto;opacity:0;visibility:hidden;transition:opacity .35s,visibility .35s}
.ov.on{opacity:1;visibility:visible}
.card{background:var(--panel);backdrop-filter:blur(16px);border:1px solid rgba(var(--acr),.4);border-radius:22px;padding:28px 34px;text-align:center;min-width:250px;max-width:min(430px,90vw);margin:16px;box-shadow:0 24px 70px rgba(0,0,0,.45),0 0 50px rgba(var(--acr),.18);transform:translateY(24px) scale(.94);transition:transform .45s cubic-bezier(.2,1.3,.4,1)}
.ov.on .card{transform:none}
.card h1{margin:0 0 6px;font:800 clamp(34px,9vw,52px) var(--head);letter-spacing:.22em;text-indent:.22em;animation:glow 2.4s ease-in-out infinite alternate}
@keyframes glow{from{text-shadow:0 0 6px rgba(var(--acr),.3)}to{text-shadow:0 0 28px var(--ac),0 0 4px var(--ac)}}
.card h2{margin:0 0 12px;font:700 26px var(--head);letter-spacing:.15em;text-transform:uppercase}
.card p{margin:6px 0;opacity:.85}
button.b{font:700 14px var(--head);letter-spacing:.12em;text-transform:uppercase;padding:11px 26px;border-radius:99px;border:0;background:var(--ac);color:var(--bg);cursor:pointer;margin:7px 4px;box-shadow:0 4px 20px rgba(var(--acr),.45);transition:transform .15s,box-shadow .15s}
button.b:hover{transform:translateY(-2px) scale(1.05);box-shadow:0 8px 28px rgba(var(--acr),.6)}
button.b:active{transform:scale(.96)}
button.b:focus-visible{outline:2px solid var(--fg);outline-offset:3px}
button.g{background:transparent;color:var(--fg);border:1.5px solid rgba(var(--acr),.7);box-shadow:none}
button:disabled{opacity:.3;pointer-events:none}
#start{font-size:18px;padding:15px 54px;animation:pulse 1.1s infinite alternate}
.row{display:flex;justify-content:space-between;align-items:center;gap:14px;text-align:left;margin:12px 0;padding-bottom:10px;border-bottom:1px solid rgba(var(--acr),.15)}
.row small{opacity:.6;display:block;font-size:13px}
.row.lock{opacity:.4}
.pips{color:var(--ac);letter-spacing:2px;font-size:12px}
#toast{position:fixed;left:50%;bottom:calc(env(safe-area-inset-bottom,0px) + 28px);transform:translateX(-50%);background:var(--panel);backdrop-filter:blur(10px);color:var(--fg);border:1px solid var(--ac);box-shadow:0 0 24px rgba(var(--acr),.4);padding:10px 22px;border-radius:99px;font-weight:700;opacity:0;transition:opacity .4s;z-index:8;pointer-events:none;white-space:nowrap}
#pz{font-size:11px;letter-spacing:-2px}
#dash{width:96px;height:4px;border-radius:4px;background:rgba(var(--acr),.2);margin-top:10px;overflow:hidden;transition:opacity .3s}
#dash i{display:block;height:100%;background:var(--ac);transform-origin:left;box-shadow:0 0 8px var(--ac)}
@media (max-width:480px){.card{padding:22px 20px}}
@media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}
</style>
</head>
<body>
<canvas id="c"></canvas>
<div class="hud">
  <div><div id="score">0</div><div class="s" id="best"></div><div class="s" id="combo"></div><div class="s" id="lives"></div><div id="fx"></div><div id="dash"><i></i></div></div>
  <div style="display:flex;align-items:flex-start"><div id="fps"></div><button id="pz" aria-label="Szünet">❚❚</button><button id="gear" aria-label="Beállítások">⚙</button></div>
</div>
<div id="panel">
  <b>Beállítások</b>
  <label>Minőség <select id="q"><option value="high">Jó</option><option value="low">Rossz (gyors)</option></select></label>
  <label>Stílus <select id="skin"></select></label>
  <label>FPS számláló <input type="checkbox" id="fpsOn"></label>
  <label>Végtelen mód <input type="checkbox" id="endless"></label>
  <label>Zene <input type="checkbox" id="musOn"></label>
  <label>Hangerő <input type="range" id="vol" min="0" max="1" step=".05"></label>
</div>
<div class="ov on" id="menu"><div class="card">
  <h1>DRIFT</h1><p id="mInfo"></p><p id="mDaily" style="font-size:13px"></p>
  <button class="b" id="start">Start</button><br>
  <button class="b g" id="shopB">Bolt</button><button class="b g" id="achB">Sikerek</button>
  <p style="font-size:12px;opacity:.5">Mozgás: egér / ujj / WASD / gamepad · Dash: Szóköz, jobb klikk, dupla koppintás · Szünet: P</p>
</div></div>
<div class="ov" id="over"><div class="card"><h2>Vége</h2><p id="o1"></p><p id="o2"></p><p id="o3"></p>
  <button class="b" id="again">Újra</button><button class="b g" id="toMenu">Menü</button></div></div>
<div class="ov" id="modal"><div class="card" id="mc"></div></div>
<div class="ov" id="pause"><div class="card"><h2>Szünet</h2><button class="b" id="resume">Folytatás</button><br><button class="b g" id="pMenu">Menü</button></div></div>
<div id="toast"></div>
<script>
(()=>{
const $=id=>document.getElementById(id);
const cv=$('c'),ctx=cv.getContext('2d');
let S={q:'high',fps:true,mus:true,vol:.5,endless:false,best:0,cr:0,up:{sh:0,du:0,mg:0,li:0},ach:{},daily:{d:'',done:0},skin:'min'};
try{const o=JSON.parse(localStorage.getItem('drift3')||'{}');Object.assign(S,o)}catch(e){}
const save=()=>{try{localStorage.setItem('drift3',JSON.stringify(S))}catch(e){}};
const SK={min:{n:'Minimál',ac:'224,69,58'},neon:{n:'Neon',fg:'#39ff14',bg:'5,5,15',ac:'255,43,214'},cyber:{n:'Cyberpunk',fg:'#00e5ff',bg:'14,6,30',ac:'255,230,0'},retro:{n:'Retro pixel',fg:'#9bbc0f',bg:'15,56,15',ac:'155,188,15',px:1}};
$('skin').innerHTML=Object.keys(SK).map(k=>`<option value="${k}">${SK[k].n}</option>`).join('');
$('q').value=S.q;$('skin').value=S.skin;$('fpsOn').checked=S.fps;$('musOn').checked=S.mus;$('vol').value=S.vol;$('endless').checked=S.endless;
let W,H,dpr;
function resize(){dpr=S.q==='high'?Math.min(devicePixelRatio||1,2):1;W=innerWidth;H=innerHeight;cv.width=W*dpr;cv.height=H*dpr}
addEventListener('resize',resize);resize();

/* ---------- audio ---------- */
let ac,master,noise,started=false,inten=0,tr=0;
const scale=[0,2,4,7,9];
const note=(d,o)=>220*Math.pow(2,(scale[d%5]+12*(o+Math.floor(d/5)))/12);
function tone(f,dur,vol,type='sine'){
  if(!ac)return;const o=ac.createOscillator(),g=ac.createGain(),t=ac.currentTime;
  o.type=type;o.frequency.value=f;g.gain.setValueAtTime(0,t);g.gain.linearRampToValueAtTime(vol,t+.05);
  g.gain.exponentialRampToValueAtTime(.0001,t+dur);o.connect(g);g.connect(master);o.start(t);o.stop(t+dur+.1);
}
function kick(){
  if(!ac)return;const o=ac.createOscillator(),g=ac.createGain(),t=ac.currentTime;
  o.frequency.setValueAtTime(130,t);o.frequency.exponentialRampToValueAtTime(40,t+.15);
  g.gain.setValueAtTime(.45,t);g.gain.exponentialRampToValueAtTime(.001,t+.25);o.connect(g);g.connect(master);o.start(t);o.stop(t+.3);
}
function hat(){
  if(!ac)return;const s=ac.createBufferSource(),f=ac.createBiquadFilter(),g=ac.createGain(),t=ac.currentTime;
  s.buffer=noise;f.type='highpass';f.frequency.value=7000;g.gain.setValueAtTime(.12,t);g.gain.exponentialRampToValueAtTime(.001,t+.05);
  s.connect(f);f.connect(g);g.connect(master);s.start(t);s.stop(t+.06);
}
function initAudio(){
  if(started)return;started=true;
  ac=new (window.AudioContext||window.webkitAudioContext)();
  master=ac.createGain();master.gain.value=S.mus?S.vol:0;master.connect(ac.destination);
  noise=ac.createBuffer(1,ac.sampleRate*.1,ac.sampleRate);
  const d=noise.getChannelData(0);for(let i=0;i<d.length;i++)d[i]=Math.random()*2-1;
  let k=0;
  const tick=()=>{
    if(S.mus&&ac.state==='running'){
      if(k%2===0){
        const st=k/2|0;
        if(st%4===0){const r=[0,3,4,2][(st/4|0)%4];tone(note(r,-1),3.5,.18);tone(note(r+2,0),3,.08)}
        if(Math.random()<.55+tr*.3)tone(note(Math.floor(Math.random()*7),1+(tr>.6?1:0)),2,.07);
      }
      if(playing){
        if(inten>=1&&k%4===0)kick();
        if(inten>=3&&k%4===2)kick();
        if(inten>=2&&k%2===1)hat();
        if(tr>.5)hat();
      }
      k++;
    }
    setTimeout(tick,350*(1-.35*tr));
  };
  tick();
}
const sfx=i=>tone(note(i%10,1),.6,.25,'triangle');
const applyVol=()=>{if(master)master.gain.value=S.mus?S.vol:0};
const wake=()=>{initAudio();if(ac&&ac.state==='suspended')ac.resume()};
addEventListener('pointerdown',wake,{passive:true});addEventListener('keydown',wake);

/* ---------- meta ---------- */
const UP=[{id:'sh',n:'Kezdő pajzs',d:'+2 mp pajzs induláskor',max:3,c:15},{id:'du',n:'Hosszabb power-up',d:'+20% időtartam',max:5,c:20},{id:'mg',n:'Mágnes',d:'+45 px vonzáskör',max:5,c:12},{id:'li',n:'Extra élet',d:'+1 élet',max:2,c:40},{id:'dc',n:'Gyorsabb dash',d:'-15% hűtési idő',max:4,c:25}];
const ACH=[
 {id:'c10',t:'10-es kombó',f:()=>maxCombo>=10},{id:'c25',t:'25-ös kombó',f:()=>maxCombo>=25},
 {id:'s50',t:'50 pont',f:()=>score>=50},{id:'s200',t:'200 pont',f:()=>score>=200},
 {id:'nm1',t:'Első Close Call',f:()=>nm>=1},{id:'nm5',t:'5 Close Call egy körben',f:()=>nm>=5},
 {id:'pw',t:'Mindhárom power-up egy körben',f:()=>types.size>=3},{id:'t30',t:'30 mp túlélés',f:()=>tm>=30},
 {id:'fast',t:'5 gyűjtés 3 mp alatt',f:()=>fastC>=5},{id:'d10',t:'10 dash egy körben',f:()=>dashN>=10},{id:'wv',t:'Élj túl egy hullámot',f:()=>wavesDone>=1}];
const MIS=[{t:'Érj el 100 pontot',r:15,f:()=>score>=100},{t:'3 Close Call egy körben',r:15,f:()=>nm>=3},{t:'Érj el ×15 kombót',r:15,f:()=>maxCombo>=15},{t:'Élj túl 60 másodpercet',r:15,f:()=>tm>=60}];
const today=new Date().toISOString().slice(0,10),mis=MIS[Math.floor(Date.now()/864e5)%MIS.length];
if(S.daily.d!==today)S.daily={d:today,done:0};
const tq=[];let tb=0;
setInterval(()=>{if(tb>0){if(--tb===0)$('toast').style.opacity=0}else if(tq.length){$('toast').textContent=tq.shift();$('toast').style.opacity=1;tb=6}},500);
function chk(){
  for(const a of ACH)if(!S.ach[a.id]&&a.f()){S.ach[a.id]=1;S.cr+=5;tq.push('🏆 '+a.t+' · +5 ◆');save()}
  if(!S.daily.done&&mis.f()){S.daily.done=1;S.cr+=mis.r;tq.push('⭐ Napi küldetés kész · +'+mis.r+' ◆');save()}
}
const lvl=id=>S.up[id]||0;

/* ---------- game ---------- */
const P={x:innerWidth/2,y:innerHeight/2},T={x:P.x,y:P.y};
const COL={shield:'#3b8bff',slow:'#a35cff',x2:'#f5b800'};
let items=[],haz=[],parts=[],texts=[],score,combo,maxCombo,lives,shake,hurt,spawnI,spawnH,spawnP,shield,slow,x2,bt,tm,nm,types,ct,fastC,playing=false,moved=false,paused=false,dashCd=0,dashT=0,waveT=40,lvShown=1,dashN=0,waveAlive=0,wavesDone=0,gpd=0;
const rnd=(a,b)=>a+Math.random()*(b-a);
function reset(){
  items=[];haz=[];parts=[];texts=[];score=0;combo=0;maxCombo=0;lives=3+lvl('li');shake=0;hurt=0;
  spawnI=0;spawnH=1;spawnP=rnd(8,12);shield=lvl('sh')*2;slow=0;x2=0;bt=0;tm=0;nm=0;types=new Set();ct=[];fastC=0;inten=0;paused=false;dashCd=0;dashT=0;waveT=40;lvShown=1;dashN=0;waveAlive=0;wavesDone=0;$('pause').classList.remove('on');
  ['menu','over','modal'].forEach(i=>$(i).classList.remove('on'));playing=true;
}
function showMenu(){
  playing=false;paused=false;$('pause').classList.remove('on');applyVol();haz=[];items=[];$('over').classList.remove('on');$('modal').classList.remove('on');
  $('mInfo').textContent='Rekord '+S.best+' · ◆ '+S.cr;
  $('mDaily').textContent=(S.daily.done?'✅ ':'⭐ ')+'Napi küldetés: '+mis.t+' (+'+mis.r+' ◆)';
  $('menu').classList.add('on');
}
showMenu();
addEventListener('pointermove',e=>{T.x=e.clientX;T.y=e.clientY});
addEventListener('pointerdown',e=>{T.x=e.clientX;T.y=e.clientY});
const keys={};
addEventListener('keydown',e=>{keys[e.key.toLowerCase()]=1;if((e.key==='Enter'||e.key===' ')&&!playing&&!$('modal').classList.contains('on'))reset()});
addEventListener('keyup',e=>{keys[e.key.toLowerCase()]=0});
function dcMax(){return 3*(1-.15*lvl('dc'))}
function dash(){
  if(!playing||paused||dashCd>0)return;
  const dx=T.x-P.x,dy=T.y-P.y,d=Math.hypot(dx,dy);if(d<12)return;
  const L=Math.min(d,180),ux=dx/d,uy=dy/d;
  for(let i=0;i<8;i++)burst(P.x+ux*L*i/8,P.y+uy*L*i/8,'a',2);
  P.x+=ux*L;P.y+=uy*L;dashT=.28;dashCd=dcMax();dashN++;tone(520,.25,.22,'sawtooth');tone(780,.2,.12);
}
function togglePause(){
  if(!playing)return;
  paused=!paused;$('pause').classList.toggle('on',paused);
  if(master)master.gain.value=paused?(S.mus?S.vol*.2:0):(S.mus?S.vol:0);
}
function spawnWave(lv){
  const n=26,R=Math.max(W,H)*.62,gap=Math.random()*6.28,s=170+lv*12,tx=P.x,ty=P.y;
  for(let i=0;i<n;i++){
    const a=i/n*6.283;
    if(Math.abs(Math.atan2(Math.sin(a-gap),Math.cos(a-gap)))<.45)continue;
    const vx=-Math.cos(a)*s,vy=-Math.sin(a)*s;
    haz.push({x:tx+Math.cos(a)*R,y:ty+Math.sin(a)*R,r:15,vx,vy,s,k:'w',t:0,px:-vy/s,py:vx/s,w:1});
  }
  waveAlive=1;shake=8;say('HULLÁM! Keresd a rést',W/2,H*.3,1);tone(70,1.2,.3,'sawtooth');
}
addEventListener('keydown',e=>{
  if(e.repeat)return;const k=e.key.toLowerCase();
  if(playing&&(k===' '||k==='shift')){e.preventDefault();dash()}
  if(k==='p'||k==='escape')togglePause();
});
addEventListener('contextmenu',e=>{e.preventDefault();dash()});
let lastTap=0;
addEventListener('pointerdown',e=>{if(e.pointerType==='mouse')return;const n=performance.now();if(n-lastTap<300)dash();lastTap=n},{passive:true});
document.addEventListener('visibilitychange',()=>{if(document.hidden&&playing&&!paused)togglePause()});

function burst(x,y,col,n){
  n=S.q==='high'?n:Math.ceil(n/4);
  for(let i=0;i<n;i++){const a=rnd(0,6.28),s=rnd(40,200);parts.push({x,y,vx:Math.cos(a)*s,vy:Math.sin(a)*s,l:1,c:col})}
}
const say=(t,x,y,b)=>texts.push({t,x,y,l:1,b});
function spawnItem(type){items.push({x:rnd(40,W-40),y:rnd(90,H-50),r:type?13:11,life:1,type,span:type?8:6})}
function spawnHaz(lv){
  const e=Math.random()*4|0,r=rnd(14,28);let x,y;
  if(e===0){x=-r;y=rnd(0,H)}else if(e===1){x=W+r;y=rnd(0,H)}else if(e===2){x=rnd(0,W);y=-r}else{x=rnd(0,W);y=H+r}
  const a=Math.atan2(P.y+rnd(-150,150)-y,P.x+rnd(-150,150)-x),s=rnd(60,110)*(1+lv*.25),q=Math.random();
  const k=lv>3&&q<.2?'h':lv>1.8&&q<.45?'z':'n';
  const vx=Math.cos(a)*s,vy=Math.sin(a)*s;
  haz.push({x,y,r,vx,vy,s,k,t:0,px:-vy/s,py:vx/s});
}
function bumpScore(){const s=$('score');s.classList.remove('b');void s.offsetWidth;s.classList.add('b')}
const praise=[[5,'Szép!'],[10,'Nagyszerű!'],[20,'Félelmetes!'],[40,'LEGENDÁS!']];
function gameOver(){
  playing=false;inten=0;tone(80,1.2,.35,'sawtooth');
  const nb=score>S.best;if(nb)S.best=score;
  const g=(score/8|0)+nm;S.cr+=g;save();
  $('o1').textContent='Pontszám: '+score+(nb?' · új rekord!':'');
  $('o2').textContent='Legjobb kombó: ×'+maxCombo+' · Close Call: '+nm;
  $('o3').textContent='+'+g+' ◆ (összesen '+S.cr+')';
  $('over').classList.add('on');
}
function nearMiss(){
  nm++;const b=10*(x2>0?2:1);score+=b;bt=.9;shake=6;bumpScore();
  say('Close Call! +'+b,P.x,P.y-40);tone(note(9,1),.5,.25,'square');burst(P.x,P.y,'a',10);
}

function step(real){
  if(paused)return;
  let dx=(keys.d||keys.arrowright?1:0)-(keys.a||keys.arrowleft?1:0),dy=(keys.s||keys.arrowdown?1:0)-(keys.w||keys.arrowup?1:0);
  const gp=navigator.getGamepads?navigator.getGamepads()[0]:null;
  if(gp){if(gp.buttons[1]&&gp.buttons[1].pressed){if(!gpd){gpd=1;dash()}}else gpd=0;const ax=gp.axes[0]||0,ay=gp.axes[1]||0;if(Math.abs(ax)>.2)dx+=ax;if(Math.abs(ay)>.2)dy+=ay;if(gp.buttons[0]&&gp.buttons[0].pressed&&!playing&&!$('modal').classList.contains('on'))reset()}
  if(dx||dy){T.x=Math.max(0,Math.min(W,T.x+dx*520*real));T.y=Math.max(0,Math.min(H,T.y+dy*520*real))}
  const dt=real*(bt>0?.35:1);
  for(const p of parts){p.x+=p.vx*dt;p.y+=p.vy*dt;p.vx*=.96;p.vy*=.96;p.l-=dt*1.4}
  parts=parts.filter(p=>p.l>0);
  for(const t of texts){t.y-=30*dt;t.l-=dt*.8}
  texts=texts.filter(t=>t.l>0);
  shake*=.9;
  tr+=((playing?Math.min(1,combo/25):0)-tr)*real*2;
  if(!playing)return;
  const lv=Math.min(1+score/25,6),dm=1+.2*lvl('du'),now=performance.now();
  inten=Math.min(3,(lv>1.5)+(lv>3)+(combo>=8));
  tm+=real;bt=Math.max(0,bt-real);
  {const L=1+(score/50|0);if(L>lvShown){lvShown=L;say('SZINT '+L,W/2,H*.28,1);tone(note(4,1),.8,.25,'triangle');burst(W/2,H*.28,'a',24)}}
  waveT-=real;if(waveT<=0){spawnWave(lv);waveT=35}
  P.x+=(T.x-P.x)*Math.min(1,real*10);P.y+=(T.y-P.y)*Math.min(1,real*10);
  if(tr>.3)burst(P.x,P.y,'a',1);
  if(tr>.7&&Math.random()<.5)burst(rnd(0,W),rnd(0,H),'a',2);
  shield=Math.max(0,shield-dt);slow=Math.max(0,slow-dt);x2=Math.max(0,x2-dt);hurt=Math.max(0,hurt-dt*1.5);dashCd=Math.max(0,dashCd-real);dashT=Math.max(0,dashT-real);
  spawnI-=dt;if(spawnI<=0&&items.filter(i=>!i.type).length<4){spawnItem(null);spawnI=rnd(.6,1.4)}
  spawnP-=dt;if(spawnP<=0){spawnItem(['shield','slow','x2'][Math.random()*3|0]);spawnP=rnd(10,16)}
  spawnH-=dt;if(spawnH<=0){spawnHaz(lv);spawnH=Math.max(.35,1.4/Math.sqrt(lv))}
  const mag=lvl('mg')*45;
  for(const it of items){
    it.life-=dt/it.span;
    const d=Math.hypot(it.x-P.x,it.y-P.y);
    if(mag&&d<mag+40){it.x+=(P.x-it.x)*dt*4;it.y+=(P.y-it.y)*dt*4}
    if(d<it.r+10){
      it.life=0;
      if(it.type){
        types.add(it.type);
        if(it.type==='shield')shield=6*dm;else if(it.type==='slow')slow=5*dm;else x2=8*dm;
        burst(it.x,it.y,COL[it.type],22);tone(note(7,1),.8,.25,'triangle');
        say({shield:'Pajzs!',slow:'Lassítás!',x2:'×2 pont!'}[it.type],it.x,it.y);
      }else{
        combo++;maxCombo=Math.max(maxCombo,combo);score+=combo*(x2>0?2:1);sfx(combo);burst(it.x,it.y,'f',14+(tr*14|0));bumpScore();
        ct.push(now);ct=ct.filter(x=>now-x<3000);fastC=Math.max(fastC,ct.length);
        for(const [n,t] of praise)if(combo===n)say(t,P.x,P.y-30);
      }
    }
  }
  items=items.filter(i=>i.life>0);
  const hs=slow>0?.35:1,g=dt*hs;
  for(const h of haz){
    if(h.k==='h'&&h.t<3){const d=Math.hypot(P.x-h.x,P.y-h.y)||1;h.vx+=((P.x-h.x)/d*h.s-h.vx)*g*1.2;h.vy+=((P.y-h.y)/d*h.s-h.vy)*g*1.2}
    const w=h.k==='z'?Math.sin(h.t*6)*h.s*.9:0;
    h.x+=(h.vx+h.px*w)*g;h.y+=(h.vy+h.py*w)*g;h.t+=g;
    const d=Math.hypot(h.x-P.x,h.y-P.y),hit=h.r+(shield>0?20:8);
    if(d<hit){
      h.cl=0;
      if(shield>0){h.dead=1;burst(h.x,h.y,'#3b8bff',12);tone(note(2,0),.3,.2,'square')}
      else if(hurt<=0&&dashT<=0){
        h.hit=1;combo=0;hurt=1;shake=12;burst(P.x,P.y,'#e0453a',20);tone(110,.8,.3,'sawtooth');
        if(!S.endless&&--lives<=0)gameOver();
      }
    }else if(d<hit+24)h.cl=1;
    else if(h.cl){h.cl=0;if(!h.hit&&!h.nm&&shield<=0&&dashT<=0){h.nm=1;nearMiss()}}
  }
  haz=haz.filter(h=>!h.dead&&((h.w&&h.t<6)||(h.x>-80&&h.x<W+80&&h.y>-80&&h.y<H+80)));
  if(waveAlive&&!haz.some(h=>h.w)){waveAlive=0;wavesDone++;score+=3;bumpScore();say('Hullám túlélve! +3',W/2,H*.3,1);tone(note(8,1),.7,.25,'triangle')}
  chk();
}

const dark=()=>{const d=document.documentElement.dataset.theme;return d?d==='dark':matchMedia('(prefers-color-scheme:dark)').matches};
const HC={n:'#e0453a',z:'#ff8a2a',h:'#d0176f',w:'#ff4d6d'};
let sk=SK.min,tk;
function dot(x,y,r,stroke){ctx.beginPath();if(sk.px)ctx.rect(x-r,y-r,r*2,r*2);else ctx.arc(x,y,r,0,6.28);stroke?ctx.stroke():ctx.fill()}
function draw(){
  sk=SK[S.skin]||SK.min;
  const hi=S.q==='high'&&!sk.px,dk=dark(),fg=sk.fg||(dk?'#e8e8ea':'#1c1c1e'),bg=sk.bg||(dk?'13,15,20':'244,241,234'),acc=sk.ac,now=performance.now();
  document.body.style.background=`rgb(${bg})`;
  const R=document.documentElement.style,key=S.skin+dk;
  if(key!==tk){tk=key;R.setProperty('--ac','rgb('+acc+')');R.setProperty('--acr',acc);document.body.dataset.skin=S.skin;
    if(S.skin==='min')['--fg','--bg','--panel'].forEach(k=>R.removeProperty(k));else{R.setProperty('--fg',fg);R.setProperty('--bg','rgb('+bg+')');R.setProperty('--panel','rgba('+bg+',.88)')}}
  R.setProperty('--tr',tr.toFixed(2));R.setProperty('--hurt',Math.max(0,hurt||0).toFixed(2));
  ctx.setTransform(dpr,0,0,dpr,0,0);
  ctx.fillStyle=S.q==='high'?`rgba(${bg},.22)`:`rgb(${bg})`;ctx.fillRect(0,0,W,H);
  if(tr>.02){ctx.fillStyle=`rgba(${acc},${tr*.12*(.5+.5*Math.sin(now/(60000/(110+tr*60))*6.28))})`;ctx.fillRect(0,0,W,H)}
  if(shake>.5)ctx.translate(rnd(-shake,shake),rnd(-shake,shake));
  for(const it of items){
    const c=it.type?COL[it.type]:fg;
    ctx.globalAlpha=it.life<.25?it.life*4:.95;ctx.strokeStyle=c;ctx.fillStyle=c;ctx.lineWidth=2;
    if(hi){ctx.shadowColor=c;ctx.shadowBlur=18}
    const r=it.r*(.5+.5*it.life);
    if(it.type)dot(it.x,it.y,r);else{dot(it.x,it.y,r,1);dot(it.x,it.y,3)}
  }
  ctx.shadowBlur=0;
  for(const h of haz){
    ctx.fillStyle=HC[h.k];ctx.globalAlpha=.85;
    if(hi){ctx.shadowColor=HC[h.k];ctx.shadowBlur=22}
    dot(h.x,h.y,h.r);
  }
  ctx.shadowBlur=0;
  for(const p of parts){ctx.globalAlpha=Math.max(0,p.l);ctx.fillStyle=p.c==='f'?fg:p.c==='a'?`rgb(${acc})`:p.c;ctx.fillRect(p.x,p.y,3,3)}
  if(playing){
    ctx.globalAlpha=hurt>0&&((hurt*10)|0)%2?.3:1;ctx.fillStyle=fg;
    if(hi){ctx.shadowColor=fg;ctx.shadowBlur=24}
    dot(P.x,P.y,9);ctx.shadowBlur=0;
    if(shield>0){ctx.globalAlpha=shield<1.5&&((shield*8)|0)%2?.2:.8;ctx.strokeStyle=COL.shield;ctx.lineWidth=3;dot(P.x,P.y,20,1)}
    if(dashT>0){ctx.globalAlpha=.7;ctx.strokeStyle=fg;ctx.lineWidth=2;dot(P.x,P.y,9+(.28-dashT)*160,1)}
  }
  ctx.globalAlpha=1;ctx.textAlign='center';
  for(const t of texts){ctx.globalAlpha=Math.max(0,t.l);ctx.fillStyle=fg;ctx.font=(t.b?'800 34px ':'600 18px ')+'system-ui,sans-serif';ctx.fillText(t.t,t.x,t.y)}
  ctx.globalAlpha=1;
  const c=getComputedStyle(document.documentElement).getPropertyValue('--fg');
  document.body.style.color=sk.fg||'';
  $('score').textContent=score||0;
  $('best').textContent=S.best?'Rekord '+S.best+' · ◆ '+S.cr:'';
  $('combo').textContent=combo>1?'×'+combo+' kombó':'';
  $('lives').textContent=playing?(S.endless?'∞':'♥'.repeat(Math.max(0,lives))):'';
  const f=[];if(shield>0)f.push(`<span style="color:${COL.shield}">PAJZS ${shield.toFixed(0)}</span>`);
  if(slow>0)f.push(`<span style="color:${COL.slow}">LASSÍTÁS ${slow.toFixed(0)}</span>`);
  if(x2>0)f.push(`<span style="color:${COL.x2}">×2 ${x2.toFixed(0)}</span>`);
  if(bt>0)f.push('<span>BULLET TIME</span>');
  $('fx').innerHTML=f.join('');
  $('dash').style.opacity=playing?1:0;$('dash').firstElementChild.style.transform='scaleX('+(1-(dashCd||0)/dcMax())+')';
}

let fc=0,ft=performance.now(),last=ft;
function loop(now){
  const dt=Math.min(.05,(now-last)/1000);last=now;
  step(dt);draw();
  fc++;if(now-ft>=500){$('fps').textContent=S.fps?Math.round(fc*1000/(now-ft))+' FPS':'';fc=0;ft=now}
  requestAnimationFrame(loop);
}
requestAnimationFrame(loop);

/* ---------- UI ---------- */
function modal(html){$('mc').innerHTML=html+'<br><button class="b" data-a="back">Vissza</button>';$('modal').classList.add('on')}
function shop(){
  modal(`<h2>Bolt</h2><p>◆ ${S.cr}</p>`+UP.map(u=>{const l=lvl(u.id),cost=u.c*(l+1),mx=l>=u.max;
    return `<div class="row"><div>${u.n} <span class="pips">${'●'.repeat(l)}${'○'.repeat(u.max-l)}</span><small>${u.d}</small></div><button class="b" data-a="buy" data-id="${u.id}" ${mx||S.cr<cost?'disabled':''}>${mx?'MAX':cost+' ◆'}</button></div>`}).join(''));
}
function achs(){
  modal(`<h2>Sikerek</h2><div class="row"><div>${S.daily.done?'✅':'⭐'} ${mis.t}<small>Napi küldetés · +${mis.r} ◆</small></div></div>`+
    ACH.map(a=>`<div class="row${S.ach[a.id]?'':' lock'}"><div>${S.ach[a.id]?'🏆':'🔒'} ${a.t}</div></div>`).join(''));
}
$('resume').onclick=togglePause;$('pMenu').onclick=showMenu;$('pz').onclick=togglePause;$('shopB').onclick=shop;$('achB').onclick=achs;$('start').onclick=reset;$('again').onclick=reset;$('toMenu').onclick=showMenu;
$('modal').addEventListener('click',e=>{
  const b=e.target.closest('button');if(!b)return;
  if(b.dataset.a==='back'){$('modal').classList.remove('on');if(!playing)showMenu()}
  if(b.dataset.a==='buy'){const u=UP.find(x=>x.id===b.dataset.id),l=lvl(u.id),c=u.c*(l+1);
    if(l<u.max&&S.cr>=c){S.cr-=c;S.up[u.id]=l+1;save();shop()}}
});
['menu','over','modal','pause'].forEach(i=>$(i).addEventListener('pointerdown',e=>e.stopPropagation()));
$('gear').onclick=e=>{e.stopPropagation();$('panel').classList.toggle('on')};
$('panel').addEventListener('pointerdown',e=>e.stopPropagation());
$('q').onchange=e=>{S.q=e.target.value;resize();save()};
$('skin').onchange=e=>{S.skin=e.target.value;save()};
$('fpsOn').onchange=e=>{S.fps=e.target.checked;if(!S.fps)$('fps').textContent='';save()};
$('endless').onchange=e=>{S.endless=e.target.checked;save()};
$('musOn').onchange=e=>{S.mus=e.target.checked;initAudio();applyVol();save()};
$('vol').oninput=e=>{S.vol=+e.target.value;applyVol();save()};
})();
</script>
